<title>Tunnel Tuner</title>
<style>
  /* Light is the base set; both dark paths redefine only tokens. */
  :root {
    --ground: #eceef2;
    --panel: #ffffff;
    --panel-2: #f4f6fa;
    --line: #d3d8e2;
    --ink: #1a1f2b;
    --ink-2: #5a6274;
    --ink-3: #868ea1;
    --accent: #4453c4;
    --accent-ink: #ffffff;
    --accent-soft: #e5e8fb;
    --bezel: #c8ccd6;
    --shadow: 0 1px 2px rgba(20, 26, 40, .07), 0 8px 24px rgba(20, 26, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #14171f;
      --panel: #1c202a;
      --panel-2: #232836;
      --line: #333a4a;
      --ink: #e7eaf1;
      --ink-2: #a4acbe;
      --ink-3: #798195;
      --accent: #8f9bff;
      --accent-ink: #10131a;
      --accent-soft: #262d45;
      --bezel: #0c0e13;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #14171f; --panel: #1c202a; --panel-2: #232836; --line: #333a4a;
    --ink: #e7eaf1; --ink-2: #a4acbe; --ink-3: #798195; --accent: #8f9bff;
    --accent-ink: #10131a; --accent-soft: #262d45; --bezel: #0c0e13;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 22px; max-width: 68ch; }
  .cols { display: grid; grid-template-columns: minmax(0, 500px) minmax(0, 1fr); gap: 26px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

  .stage { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .screen { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .bezel { background: var(--bezel); padding: 12px; border-radius: 14px; line-height: 0; }
  canvas { image-rendering: pixelated; border-radius: 3px; display: block; width: 100%; max-width: 432px; height: auto; }
  .caption { color: var(--ink-3); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .refimg { width: 100%; max-width: 432px; border-radius: 6px; display: block; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }

  .group { padding: 14px 16px 16px; }
  .group + .group { border-top: 1px solid var(--line); }
  .group h2 { font-size: 13px; margin: 0 0 2px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .group p.note { margin: 0 0 12px; font-size: 13px; color: var(--ink-3); max-width: 62ch; }
  .ctl { display: grid; grid-template-columns: 1fr 200px 62px; gap: 10px; align-items: center; padding: 5px 0; }
  @media (max-width: 620px) { .ctl { grid-template-columns: 1fr 1fr 56px; } }
  .ctl .name { font-size: 13.5px; }
  .ctl .name small { display: block; color: var(--ink-3); font-size: 12px; }
  .ctl output { font: 13px ui-monospace, "Cascadia Mono", Consolas, monospace; text-align: right; color: var(--ink); }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .derived { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px 16px; }
  .stat { background: var(--panel-2); border-radius: 8px; padding: 9px 11px; }
  .stat b { display: block; font-size: 19px; font-weight: 600; }
  .stat span { font-size: 12px; color: var(--ink-3); }
  pre {
    margin: 0; padding: 14px 16px; overflow-x: auto; background: var(--panel-2);
    border-top: 1px solid var(--line); border-radius: 0 0 10px 10px;
    font: 12.5px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink);
  }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);
    background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<script>
// ---- the effect, transcribed from src/app/effects/TunnelEffect.cpp ----------
const W = 120, H = 120, T_ANG = 256, T_DEP = 32, AMASK = 255, DMASK = 31;

const GROUPS = [
  { title: "Geometry — standing at the lip", kind: "geom",
    note: "A funnel with a RIM, not an endless pipe. Pitch is degrees from straight down the throat: 0 stares into it, 90 looks flat across the mouth at the far lip, with sky above that line. Inside a pipe there is no horizon — perpendicular to the axis is just wall — which is why the earlier model could never show the view being described.",
    items: [
      ["PITCH", "Pitch", "degrees from straight down; 90 = level, across the mouth", 0, 89, 1, 78],
      ["CAM_R", "Where you stand", "0 = over the middle, 1 = on the lip, past = outside it", 0, 1.3, .02, 1.0],
      ["CAM_H", "Eye height", "above the rim plane", 0, .8, .02, .18],
      ["FLARE", "Funnel narrowing", "higher = steeper walls, tighter throat", .05, 1.5, .05, .35],
      ["TAN_FOV", "Horizontal FOV", "half-angle, as a tangent", .2, 1.4, .01, .7],
      ["ASPECT", "Vertical squeeze", "above 1 flattens rings into rows", .4, 2.6, .05, 1.2],
      ["K_Z", "Ring density", "texels per unit of depth", 2, 40, .5, 16],
    ]},
  { title: "Distance fade", kind: "geom",
    note: "Four steps into darkness, no far clip — a clip draws a punched hole where there should be walls falling away.",
    items: [
      ["Z1", "Fade step 1", "", .5, 30, .5, 4],
      ["Z2", "Fade step 2", "", 1, 60, .5, 10],
      ["Z3", "Fade step 3", "near black beyond this", 2, 120, 1, 22],
    ]},
  { title: "The wall", kind: "tex",
    note: "Cells are pillowed panels: black mortar around a falloff from a bright heart.",
    items: [
      ["CELL", "Cell size", "texels; 8 gives 32 cells per revolution", 4, 16, 4, 8],
      ["MORTAR", "Mortar thickness", "", .6, 2.4, .1, 1.2],
      ["FALLOFF", "Falloff exponent", "higher = brighter cell centres", .4, 3, .1, 1.2],
      ["HUE", "Hue shift", "0 keeps the reference red", 0, 359, 1, 0],
    ]},
  { title: "Motion", kind: "none",
    note: "Whole texels per frame only — a fractional rate sits still then jumps, which is visible stutter.",
    items: [
      ["FALL", "Fall speed", "down the pipe", 0, 4, 1, 1],
      ["ROLL", "Roll speed", "around it", 0, 4, 1, 1],
    ]},
];

const V = {}, EL = {};
let depth, fade, angleF, sky, skyPct = 0, tex, pal, su = 0, sv = 0, geomDirty = true, texDirty = true, palDirty = true;

const controls = document.getElementById("controls");
for (const g of GROUPS) {
  const box = document.createElement("div");
  box.className = "group";
  box.innerHTML = `<h2>${g.title}</h2>` + (g.note ? `<p class="note">${g.note}</p>` : "");
  for (const [key, name, hint, lo, hi, step, def] of g.items) {
    V[key] = def;
    const row = document.createElement("div");
    row.className = "ctl";
    row.innerHTML = `<div class="name">${name}${hint ? `<small>${hint}</small>` : ""}</div>`;
    const input = document.createElement("input");
    Object.assign(input, { type: "range", min: lo, max: hi, step: step, value: def });
    input.setAttribute("aria-label", name);
    const out = document.createElement("output");
    out.textContent = fmt(def);
    input.addEventListener("input", () => {
      V[key] = parseFloat(input.value);
      out.textContent = fmt(V[key]);
      if (g.kind === "geom") geomDirty = true;
      if (g.kind === "tex") { texDirty = true; palDirty = true; }
      paint();
    });
    EL[key] = { input, out, def };
    row.append(input, out);
    box.append(row);
  }
  controls.append(box);
}
function fmt(v) { return Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, ""); }

function buildGeometry() {
  const { PITCH, CAM_R, CAM_H, FLARE, TAN_FOV, ASPECT, K_Z, Z1, Z2, Z3 } = V;
  depth = new Uint8Array(W * H); fade = new Uint8Array(W * H); angleF = new Uint16Array(W * H);
  sky = new Uint8Array(W * H);
  // z runs DOWN into the hole; the rim plane is z = 0 and the funnel is the
  // cone r(z) = 1 - FLARE*z below it. A ray that misses, or would only meet
  // the cone above the rim, has gone out over the lip: that is sky.
  const th = PITCH * Math.PI / 180, fy0 = -Math.sin(th), fz0 = Math.cos(th);
  const pix = TAN_FOV / (W * 0.5), pixy = pix * ASPECT;
  const cy = CAM_R, cz = -CAM_H;
  const E = 1 - FLARE * cz;
  const c = cy * cy - E * E;
  let skyCount = 0;
  for (let y = 0; y < H; y++) {
    const py = (y - (H - 1) * 0.5) * pixy, dy = fy0 - py * fz0, dz = fz0 + py * fy0;
    for (let x = 0; x < W; x++) {
      const dx = (x - (W - 1) * 0.5) * pix, i = y * W + x;
      const a = dx * dx + dy * dy - FLARE * FLARE * dz * dz;
      const b = 2 * (cy * dy + E * FLARE * dz);
      let t = -1;
      if (Math.abs(a) > 1e-9) {
        const disc = b * b - 4 * a * c;
        if (disc >= 0) {
          const r = Math.sqrt(disc);
          for (const cand of [(-b - r) / (2 * a), (-b + r) / (2 * a)].sort((m, n) => m - n)) {
            if (cand > 1e-4 && cz + cand * dz >= 0) { t = cand; break; }
          }
        }
      } else if (Math.abs(b) > 1e-9) {
        const cand = -c / b;
        if (cand > 1e-4 && cz + cand * dz >= 0) t = cand;
      }
      if (t < 0) { sky[i] = 1; skyCount++; continue; }
      const z = cz + t * dz;
      let f = 0;
      if (z > Z1) f = 1;
      if (z > Z2) f = 2;
      if (z > Z3) f = 3;
      fade[i] = f;
      depth[i] = ((z * K_Z) | 0) & DMASK;
      const ang = Math.atan2(cy + t * dy, t * dx) + Math.PI;
      angleF[i] = ((ang * (T_ANG / (2 * Math.PI))) | 0) & AMASK;
    }
  }
  skyPct = 100 * skyCount / (W * H);
  geomDirty = false;
}

function buildTexture() {
  const cell = V.CELL | 0, edge = cell * 0.5 - V.MORTAR, span = cell * 0.58, m = Math.floor(cell / 4);
  tex = new Uint8Array(T_ANG * T_DEP);
  for (let v = 0; v < T_ANG; v++) {
    const cv = Math.abs((v % cell) - (cell - 1) * 0.5);
    for (let u = 0; u < T_DEP; u++) {
      const cu = Math.abs((u % cell) - (cell - 1) * 0.5);
      let t;
      if (Math.max(cu, cv) > edge) t = 0;
      else t = Math.min(126, Math.max(6, (126 * (1 - Math.pow(Math.hypot(cu, cv) / span, V.FALLOFF))) | 0));
      const mid = (cell - 1) * 0.5;
      if (cv >= mid - m && cv <= mid + m && cu <= m * 0.7) t = 0;
      tex[v * T_DEP + u] = t & 0x7f;
    }
  }
  texDirty = false;
}

function buildPalette() {
  const stops = [[0, [0, 0, 0]], [34, [88, 0, 0]], [72, [196, 8, 0]], [104, [248, 40, 16]], [127, [255, 96, 48]]];
  pal = new Uint8Array(128 * 3);
  for (let s = 0; s < stops.length - 1; s++) {
    const [a0, c0] = stops[s], [a1, c1] = stops[s + 1];
    for (let i = a0; i <= a1; i++) {
      const f = (i - a0) / Math.max(a1 - a0, 1);
      let rgb = [0, 1, 2].map(k => c0[k] + (c1[k] - c0[k]) * f);
      if (V.HUE) rgb = rotate(rgb, V.HUE / 360);
      for (let k = 0; k < 3; k++) pal[i * 3 + k] = rgb[k] | 0;
    }
  }
  palDirty = false;
}
function rotate([r, g, b], shift) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, v = max, s = max ? d / max : 0;
  let h = 0;
  if (d) h = max === r ? ((g - b) / d + (g < b ? 6 : 0)) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h = ((h / 6 + shift) % 1 + 1) % 1;
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}

const view = document.getElementById("view"), ctx = view.getContext("2d");
const off = document.createElement("canvas"); off.width = W; off.height = H;
const octx = off.getContext("2d"), img = octx.createImageData(W, H);
ctx.imageSmoothingEnabled = false;

function paint() {
  if (geomDirty) buildGeometry();
  if (texDirty) buildTexture();
  if (palDirty) buildPalette();
  const d = img.data;
  for (let i = 0; i < W * H; i++) {
    const t = sky[i] ? 0
      : tex[(((angleF[i] + sv) & AMASK) * T_DEP) | ((depth[i] + su) & DMASK)] >> fade[i];
    const p = t * 3, o = i * 4;
    d[o] = pal[p]; d[o + 1] = pal[p + 1]; d[o + 2] = pal[p + 2]; d[o + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  ctx.drawImage(off, 0, 0, view.width, view.height);
  if (document.getElementById("overlay").checked) drawOverlay();
  updateReadout();
}

// The identity overlay the screen draws on top of every frame — here only so
// you can judge whether the clock stays legible over the wall.
function drawOverlay() {
  const k = view.width / 240;
  const shadowed = (text, px, x, y, align, weight) => {
    ctx.font = `${weight} ${px * k}px ui-sans-serif, "Segoe UI", system-ui, sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = "middle";
    ctx.fillStyle = "#000"; ctx.fillText(text, (x + 2) * k, (y + 2) * k);
    ctx.fillStyle = "#fff"; ctx.fillText(text, x * k, y * k);
  };
  const now = new Date();
  shadowed(String(now.getHours()).padStart(2, "0"), 33, 112, 100, "right", 700);
  shadowed(":", 33, 120, 100, "center", 700);
  shadowed(String(now.getMinutes()).padStart(2, "0"), 33, 128, 100, "left", 700);
  shadowed("smolbase-2e00.local", 12, 120, 160, "center", 400);
  shadowed("10.0.0.32", 12, 120, 185, "center", 400);
}

function updateReadout() {
  const overLip = skyPct > 0.5;
  document.getElementById("derived").innerHTML = `
    <div class="stat"><b>${skyPct.toFixed(0)}%</b>
      <span>${overLip ? "sky — you can see past the lip" : "no sky in frame"}</span></div>
    <div class="stat"><b>${(T_ANG / (V.CELL | 0))}</b><span>cells per revolution</span></div>
    <div class="stat"><b>${(V.K_Z / (V.CELL | 0)).toFixed(2)}</b><span>rings per unit depth</span></div>
    <div class="stat"><b>37 KB</b><span>heap held while running</span></div>`;
  document.getElementById("cpp").textContent =
`constexpr float PITCH_DEG = ${V.PITCH.toFixed(0)}.0f;
constexpr float CAM_R = ${V.CAM_R.toFixed(2)}f;
constexpr float CAM_H = ${V.CAM_H.toFixed(2)}f;

constexpr float TAN_FOV = ${V.TAN_FOV.toFixed(2)}f;
constexpr float ASPECT = ${V.ASPECT.toFixed(2)}f;
constexpr float K_Z = ${V.K_Z.toFixed(1)}f;
constexpr float Z1 = ${V.Z1.toFixed(1)}f;
constexpr float Z2 = ${V.Z2.toFixed(1)}f;
constexpr float Z3 = ${V.Z3.toFixed(1)}f;
constexpr int CELL = ${V.CELL | 0};
// wall: mortar ${V.MORTAR.toFixed(1)}, falloff ${V.FALLOFF.toFixed(1)}, hue ${V.HUE | 0}
// motion: fall ${V.FALL | 0}, roll ${V.ROLL | 0} texels/frame`;
}

let last = 0;
function loop(ts) {
  if (document.getElementById("anim").checked && ts - last >= 33) {
    last = ts;
    su = (su + (V.FALL | 0)) & DMASK;
    sv = (sv + (V.ROLL | 0)) & AMASK;
    paint();
  }
  requestAnimationFrame(loop);
}

document.getElementById("showref").addEventListener("change", e => {
  document.getElementById("refbox").hidden = !e.target.checked;
});
document.getElementById("overlay").addEventListener("change", paint);
// Opened from disk this page is not a secure context, so navigator.clipboard
// is missing entirely — fall back to a throwaway textarea, which works there.
document.getElementById("copy").addEventListener("click", async () => {
  const text = document.getElementById("cpp").textContent;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-1000px";
      document.body.append(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("Constants copied");
  } catch { toast("Copy blocked — select the block and copy it"); }
});
document.getElementById("reset").addEventListener("click", () => {
  for (const k in EL) { V[k] = EL[k].def; EL[k].input.value = EL[k].def; EL[k].out.textContent = fmt(EL[k].def); }
  geomDirty = texDirty = palDirty = true;
  paint(); toast("Back to the shipped values");
});
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 1700);
}

paint();
requestAnimationFrame(loop);
</script>
