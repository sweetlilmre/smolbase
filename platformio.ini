[platformio]
build_cache_dir = .pio/libcache

; Two apps, one core (#69): each [env:*] is one App wired over the shared
; src/core/. The env's build_src_filter excludes every OTHER app directory —
; src/core/ and src/main.cpp always compile; exactly one src/app-*/ provides
; makeApp() (two = duplicate-symbol linker error, zero = missing-symbol, both
; by design). A bare `pio run` (and CI) builds every env, so no app can rot.

[env]
; Pinned to the pioarduino community platform (arduino-esp32 3.3.11 / ESP-IDF 5.5.5).
; The official platformio/espressif32 platform ships no Arduino core past 2.x —
; core 3.x exists only through this fork. Move this pin deliberately or not at all.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs

; Assembles data/ from html/ (gzip-only assets; PsychicHttp auto-serves name.gz).
extra_scripts = pre:scripts/pack_fs.py

build_flags =
    -std=gnu++17
    ; Silence ARDUHAL logging: a missing config file is the NORMAL state (in-code
    ; defaults apply), and vfs_api log_e on every failed open floods the boot log.
    -DCORE_DEBUG_LEVEL=0
    ; Uncomment for development: logs app.loop()/tick() overruns of the
    ; SMOLBASE_LOOP_BUDGET_MS soft budget to Serial.
    ;-DSMOLBASE_DEBUG=1
    -I include

; Exact pins for template reproducibility (see wayfinder tickets #3, #4).
lib_deps =
    lovyan03/LovyanGFX @ 1.2.27
    hoeken/PsychicHttp @ 3.1.2
    ; Exact pin: a floating range resolves differently between CI's cached
    ; ~/.platformio (keyed on this file's hash) and a fresh local checkout.
    bblanchon/ArduinoJson @ 7.4.3

monitor_speed = 115200


; The stock demo App (Boing clock) — src/app-smolbase/.
[env:smolbase]
build_src_filter = +<*> -<app-weather/> -<app-gcm/>
custom_app_html = src/app-smolbase/html

; The Weather Clock App (wayfinder map #63) — src/app-weather/.
[env:weatherclock]
build_src_filter = +<*> -<app-smolbase/> -<app-gcm/>
custom_app_html = src/app-weather/html
build_flags =
    ${env.build_flags}
    ; No core framebuffer (ADR 0004): the weather screen owns a static 240x64
    ; RGB565 band scratch and pushes bands directly — full color, ~27 KB less
    ; static RAM than the core buffer this build never otherwise used.
    -DSMOLBASE_FRAMEBUFFER=0

; GCM App — src/app-gcm/.
[env:gcm]
build_src_filter = +<*> -<app-smolbase/> -<app-weather/>
custom_app_html = src/app-gcm/html
build_flags =
    ${env.build_flags}
    ; Direct drawing — no core framebuffer; GcmScreen draws straight to the
    ; panel via tick(LGFX_Device&), same pattern as the weather app (ADR 0004).
    -DSMOLBASE_FRAMEBUFFER=0

