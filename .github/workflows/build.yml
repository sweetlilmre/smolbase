name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platformio.ini

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # The hybrid compile (custom_sdkconfig in platformio.ini) rebuilds the
      # IDF static libs into .pio/build/<env>/esp-idf on the first build
      # (~15+ min) and skips the rebuild when the hash stamped into
      # sdkconfig.defaults matches. Cache that state so CI pays the rebuild
      # once per platformio.ini change, not per run. (.pio also carries
      # libdeps and the build_cache_dir object cache.) If a build ever looks
      # stale after a toolchain change, bump the key prefix to bust this.
      - name: Cache project build state (hybrid IDF libs, libdeps)
        uses: actions/cache@v6
        with:
          path: |
            .pio
            sdkconfig.defaults
            managed_components
          key: idf-hybrid-v1-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Build firmware (all apps)
        run: pio run -e smolbase

      - name: Build filesystem images (all apps)
        run: pio run -e smolbase -t buildfs

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: smolbase-binaries
          path: |
            .pio/build/smolbase/firmware.bin
            .pio/build/smolbase/littlefs.bin
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cp .pio/build/smolbase/firmware.bin smolbase-firmware-${TAG}.bin
          cp .pio/build/smolbase/littlefs.bin smolbase-littlefs-${TAG}.bin
          gh release create "$TAG" \
            "smolbase-firmware-${TAG}.bin" \
            "smolbase-littlefs-${TAG}.bin" \
            --title "$TAG" \
            --generate-notes
