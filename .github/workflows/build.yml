name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platformio.ini

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # The hybrid compile (custom_sdkconfig in platformio.ini) rebuilds the
      # IDF static libs into .pio/build/<env>/esp-idf on the first build
      # (~15+ min) and skips the rebuild when the hash stamped into
      # sdkconfig.defaults matches. Cache that state so CI pays the rebuild
      # once per platformio.ini change, not per run. (.pio also carries
      # libdeps and the build_cache_dir object cache.) If a build ever looks
      # stale after a toolchain change, bump the key prefix to bust this.
      - name: Cache project build state (hybrid IDF libs, libdeps)
        uses: actions/cache@v6
        with:
          path: |
            .pio
            sdkconfig.defaults
            managed_components
          key: idf-hybrid-v1-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Build firmware (all apps)
        run: pio run

      - name: Build filesystem images (all apps)
        run: pio run -t buildfs

      # Deterministic ustar per env (docs/research/assets-tar-mechanics.md):
      # stable bytes -> stable GitHub asset digest across rebuilds.
      - name: Build asset tars
        run: |
          for app in smolbase weatherclock gcm; do
            tar --format=ustar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner                 -cf ".pio/build/${app}/assets.tar" -C "data-${app}/w" .
            tar -tvf ".pio/build/${app}/assets.tar"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: firmware-binaries
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/littlefs.bin
            .pio/build/*/assets.tar
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          assets=()
          for app in smolbase weatherclock gcm; do
            cp ".pio/build/${app}/firmware.bin" "${app}-firmware-${TAG}.bin"
            cp ".pio/build/${app}/littlefs.bin" "${app}-littlefs-${TAG}.bin"
            cp ".pio/build/${app}/assets.tar" "${app}-assets-${TAG}.tar"
            assets+=("${app}-firmware-${TAG}.bin" "${app}-littlefs-${TAG}.bin" "${app}-assets-${TAG}.tar")
          done
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" \
            --generate-notes
