name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platformio.ini

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO Core
        run: pip install platformio

      - name: Build firmware (all apps)
        run: pio run -e smolbase

      - name: Build filesystem images (all apps)
        run: pio run -e smolbase -t buildfs

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: smolbase-binaries
          path: |
            .pio/build/smolbase/firmware.bin
            .pio/build/smolbase/littlefs.bin
          retention-days: 14

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" \
            ".pio/build/smolbase/firmware.bin#smolbase-firmware-${TAG}.bin" \
            ".pio/build/smolbase/littlefs.bin#smolbase-littlefs-${TAG}.bin" \
            --title "$TAG" \
            --generate-notes
