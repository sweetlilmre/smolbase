name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# One matrix leg per App, because there is no multi-target build any more: the
# App is a configure-time choice (see CMakeLists.txt). Every App still builds on
# every push, which is the guarantee `pio run` used to give.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [smolbase, weatherclock, gcm]
    steps:
      - uses: actions/checkout@v7

      # Everything the build fetches from the network, cached. Without these
      # every leg re-resolves the component registry, re-clones LovyanGFX and
      # rebuilds the littlefs-python venv before it compiles a single file.
      #
      # Keys are content-addressed on what actually determines the contents, so
      # a stale entry is impossible rather than merely unlikely:
      #   managed_components  <- dependencies.lock (the resolved dependency set)
      #   lovyangfx/upstream  <- the CMakeLists that pins the tag
      - name: Cache managed components
        uses: actions/cache@v6
        with:
          path: managed_components
          key: idf-components-${{ hashFiles('dependencies.lock') }}

      - name: Cache LovyanGFX checkout
        uses: actions/cache@v6
        with:
          path: components/lovyangfx/upstream
          key: lovyangfx-${{ hashFiles('components/lovyangfx/CMakeLists.txt') }}

      # ccache is enabled by default in the IDF build, so this is the one that
      # actually moves the wall clock on a warm run. Per-App because each App
      # compiles a different source set; restore-keys lets a new commit start
      # from the previous run's cache instead of cold. CCACHE_DIR is redirected
      # under the workspace because that is what the container has mounted.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.app }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.app }}-

      # Pinned to the IDF version the migration was verified on. v6.0.2 needs
      # the pass-through touch filter in Touch.cpp (upstream RAW-read guard bug
      # espressif/esp-idf#18811, fixed after this tag) — that workaround is
      # valid on fixed versions too, so moving this pin is safe but deliberate.
      - name: Build ${{ matrix.app }}
        uses: espressif/esp-idf-ci-action@v1
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 400M
          # Compiler paths differ between container runs; hash the preprocessed
          # source instead of the command line so the cache survives that.
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
        with:
          esp_idf_version: v6.0.2
          target: esp32
          # The App is selected with -D, and the assets + filesystem image come
          # from the smolbase_assets / littlefs targets the root CMakeLists wires
          # into the default build. ccache -s at the end reports the hit rate, so
          # a cache that silently stops working is visible in the log.
          command: >-
            idf.py -B build/${{ matrix.app }} -D SMOLBASE_APP=${{ matrix.app }} build
            && ccache -s

      # Deterministic ustar (docs/research/assets-tar-mechanics.md): stable bytes
      # -> stable GitHub asset digest across rebuilds, which AssetUpdate verifies.
      #
      # Written straight into dist/ and NOT into build/: esp-idf-ci-action runs
      # the build inside a container as root, so build/ and everything in it is
      # root-owned, while these steps run as the runner user. Creating a file
      # under build/ therefore fails with EACCES -- it did, on the first CI run
      # this workflow ever had. Reading what the build produced is unaffected,
      # which is why the copies below still work.
      - name: Build asset tar
        run: |
          mkdir -p dist
          tar --format=ustar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf "dist/${{ matrix.app }}-assets.tar" -C "data-${{ matrix.app }}/w" .
          tar -tvf "dist/${{ matrix.app }}-assets.tar"

      # Names carry the App so the three legs' artifacts can be told apart, and
      # so the release job below can pick them up unambiguously.
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp "build/${{ matrix.app }}/smolbase.bin" "dist/${{ matrix.app }}-firmware.bin"
          cp "build/${{ matrix.app }}/spiffs.bin" "dist/${{ matrix.app }}-littlefs.bin"

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.app }}
          path: dist/*
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      # Asset names must stay <app>-<kind>-<tag>.<ext>: GhUpdate and AssetUpdate
      # build exactly these names from SMOLBASE_FW_ASSET_PREFIX /
      # SMOLBASE_ASSETS_PREFIX plus the tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          assets=()
          for app in smolbase weatherclock gcm; do
            for kind in firmware:bin littlefs:bin assets:tar; do
              name=${kind%:*}; ext=${kind#*:}
              mv "dist/${app}-${name}.${ext}" "${app}-${name}-${TAG}.${ext}"
              assets+=("${app}-${name}-${TAG}.${ext}")
            done
          done
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" \
            --generate-notes
