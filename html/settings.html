<!doctype html>
<!-- Settings UI — variant D (top tabs, one page shown at a time; ticket #7,
     swipe paging removed by ticket #25 — it didn't work on real hardware).
     A pure static asset over the JSON contract (ticket #14): sections and fields
     render from GET /api/settings (schema + values), saves POST a flat value map.
     Swap this file (and repack the filesystem image) to change the UI — zero
     firmware changes. Timezone dropdown is fed by zones.json (IANA -> POSIX,
     nayarsystems/posix_tz_db, MIT). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smolbase settings</title>
<link rel="stylesheet" href="/smolbase.css">
<style>
  h1 { font-size: 1.1rem; margin: 0; }
  .field { margin-bottom: 0.9rem; }
  .toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--accent-ink); padding: 0.45rem 1rem;
    border-radius: 999px; font-size: 0.85rem; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 98; }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); color: #fff; }

  .d-wrap { max-width: 34rem; margin: 0 auto; padding: 1rem 0 3rem; }
  .d-dev { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; padding: 0 1rem 0.75rem; font-size: 0.8rem; align-items: baseline; }
  .d-dev .mono { color: var(--muted); }
  .d-tabs { display: flex; gap: 0.35rem; overflow-x: auto; padding: 0 1rem 0.6rem;
    border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .d-tabs::-webkit-scrollbar { display: none; }
  .d-tabs button { border-radius: 999px; padding: 0.35rem 0.85rem; white-space: nowrap; font-size: 0.85rem; }
  .d-tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .dz-head { font-size: 0.95rem; color: var(--danger); margin: 1.6rem 0 0.5rem; }
  .nets { list-style: none; margin: 0.6rem 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .nets li + li { border-top: 1px solid var(--line); }
  .nets .row { width: 100%; text-align: left; border: 0; border-radius: 0; background: none;
    display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.55rem 0.8rem; }
  .nets .join { display: none; padding: 0 0.8rem 0.8rem; }
  .nets li.open .join { display: block; }
  .d-page { display: none; padding: 1.25rem 1rem 0; }
  .d-page.on { display: block; }
  .d-page h1 { margin-bottom: 1rem; }
  .dz-box { border: 1px solid var(--danger); background: var(--danger-bg); border-radius: 8px; padding: 1rem; }
</style>
</head>
<body>
<div id="app"><p class="hint" style="padding:1.5rem 1rem">Loading settings…</p></div>
<div class="toast" id="toast">Saved</div>

<script src="/smolbase.js"></script>
<script>
"use strict";
/* esc(), EYE/EYE_OFF and the [data-eye] password toggle come from smolbase.js */
const app = document.getElementById("app");
let toastTimer;
function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg || "Saved";
  t.classList.toggle("err", !!err);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), err ? 2600 : 1400);
}

let STATUS = {}, ZONES = {}, SCHEMA = [];

/* ---- field renderers (from the schema; "tz" is hidden, "tz_name" becomes the
   zones.json-backed dropdown, "brightness" gets a slider) ---- */
function renderField(s) {
  const id = "f_" + s.key;
  if (s.key === "tz") return ""; // applied POSIX string; staged via the tz_name dropdown
  if (s.key === "tz_name") {
    const names = Object.keys(ZONES);
    if (s.value && !ZONES[s.value]) names.unshift(s.value); // keep an unknown stored zone selectable
    return `<div class="field"><label for="${id}">${esc(s.label)}</label>
      <select id="${id}" data-key="tz_name" data-type="tz">${names.map(z =>
        `<option value="${esc(z)}"${z === s.value ? " selected" : ""}>${esc(z)}</option>`).join("")}</select>
      <p class="hint">${names.length} zones from <span class="mono">zones.json</span>; the matching POSIX rule is saved with it.</p></div>`;
  }
  if (s.type === "bool") {
    return `<div class="field"><label style="color:var(--ink)"><input type="checkbox" id="${id}"
      data-key="${esc(s.key)}" data-type="bool"${s.value ? " checked" : ""}> ${esc(s.label)}</label></div>`;
  }
  if (s.type === "int") {
    if (s.key === "brightness") {
      return `<div class="field"><label for="${id}">${esc(s.label)} — <span id="${id}_out" class="mono">${s.value}</span></label>
        <input type="range" id="${id}" data-key="${esc(s.key)}" data-type="int"
          min="${s.min}" max="${s.max}" value="${s.value}"
          oninput="document.getElementById('${id}_out').textContent=this.value"></div>`;
    }
    return `<div class="field"><label for="${id}">${esc(s.label)}</label>
      <input type="number" id="${id}" data-key="${esc(s.key)}" data-type="int"
        min="${s.min}" max="${s.max}" value="${s.value}">
      <p class="hint">${s.min} – ${s.max}</p></div>`;
  }
  if (s.type === "string" && /^#[0-9a-f]{6}$/i.test(s.value)) {
    // Same convention as index.html's picker panel: a #RRGGBB string renders
    // as a native color input (interim symmetry pending ticket #34).
    return `<div class="field"><label for="${id}">${esc(s.label)}</label>
      <input type="color" id="${id}" data-key="${esc(s.key)}" data-type="string" value="${esc(s.value)}"></div>`;
  }
  return `<div class="field"><label for="${id}">${esc(s.label)}</label>
    <input type="text" id="${id}" data-key="${esc(s.key)}" data-type="string" value="${esc(s.value)}"></div>`;
}

/* Collect the staged values inside one section page into a flat map. */
function collect(page) {
  const out = {};
  page.querySelectorAll("[data-key]").forEach(el => {
    const t = el.dataset.type;
    if (t === "bool") out[el.dataset.key] = el.checked;
    else if (t === "int") out[el.dataset.key] = Math.round(Number(el.value) || 0);
    else if (t === "tz") { out.tz_name = el.value; if (ZONES[el.value]) out.tz = ZONES[el.value]; }
    else out[el.dataset.key] = el.value;
  });
  return out;
}

async function postSettings(values) {
  const r = await fetch("/api/settings", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(values),
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

/* ---- non-schema pages ---- */
function wifiPage() {
  const net = STATUS.apMode
    ? `<p>The device is in <b>setup mode</b>, serving its own access point.</p>`
    : `<div class="field"><label>Wi-Fi connection</label>
        <p style="margin:0"><b>Connected</b> <span class="mono" style="color:var(--muted)">${
          STATUS.rssi != null ? esc(STATUS.rssi) + " dBm" : ""}</span></p>
        <p class="hint">IP <span class="mono">${esc(STATUS.ip || "?")}</span> ·
          reachable at <span class="mono">${esc(STATUS.name || "smolbase")}.local</span></p></div>`;
  const name = esc(STATUS.name || "smolbase-XXXX");
  return net + `<div class="field"><label>Join a different network…</label>
    <p class="hint" style="margin-top:0">Joining saves the new credentials and restarts — settings and timezone
    survive, only the network changes. If the password is wrong the device can't connect at boot and falls back
    to its <span class="mono">${name}</span> setup access point after ~20 s.</p>
    <button id="wfscan">Scan for networks</button>
    <div id="wflist"></div><p class="hint" id="wfmsg"></p></div>
    <h2 class="dz-head">Setup mode</h2>
    <div class="dz-box">
    <p class="hint" style="margin-top:0">Forgets the stored Wi-Fi credentials — settings survive — and restarts
    into the <span class="mono">${name}</span> setup access point, where the portal picks the new network.</p>
    <button class="danger" id="wfforget">Forget Wi-Fi &amp; restart into setup</button>
    <div id="wfafter"></div></div>`;
}

function updatePage() {
  return `<div class="field"><label>Image type</label>
    <label style="color:var(--ink);display:inline-block;margin-right:1.2rem">
      <input type="radio" name="uptarget" value="fw" checked> Firmware</label>
    <label style="color:var(--ink);display:inline-block">
      <input type="radio" name="uptarget" value="fs"> Filesystem (web assets)</label>
    <p class="hint" id="uphint">Streams into the inactive app slot; a failed upload leaves the running firmware untouched.</p></div>
    <div class="field"><label for="fwfile">Image file (.bin)</label>
    <input type="file" id="fwfile" accept=".bin">
    <p class="hint">Device restarts after a successful update. The screen freezes during flashing — that's normal.</p></div>
    <button class="primary" id="fwgo">Upload &amp; install</button>
    <p class="hint" id="fwmsg"></p>
    <p class="hint">Worth knowing now: the firmware has a built-in recovery page at
    <a href="/recover" class="mono">/recover</a> that can upload both firmware and filesystem
    images — it keeps working even if this page is wiped or broken.</p>
    <h2 class="dz-head">Danger zone</h2>
    <div class="dz-box">
    <p class="hint" style="margin-top:0">Erases <b>everything</b> — Wi-Fi credentials, all settings, and stored
      secrets — returning the device to setup mode as shipped.
      Type <b class="mono">reset</b> to confirm.</p>
    <div class="field"><input type="text" id="dzconfirm" autocomplete="off" placeholder="reset"></div>
    <button class="danger" id="dzgo" disabled>Factory reset</button>
    <div id="dzafter"></div></div>`;
}

/* ---- variant D shell ---- */
function render() {
  const heapKb = STATUS.heapFree ? Math.round(STATUS.heapFree / 1024) + " kB free" : "";
  const sections = []; // [name, html, savable]
  for (const sec of ["system", "app"]) {
    const items = SCHEMA.filter(s => s.section === sec);
    if (!items.length) continue;
    sections.push([sec === "system" ? "System" : "App",
      items.map(renderField).join(""), true]);
  }
  sections.push(["WiFi", wifiPage(), false]);
  sections.push(["Update", updatePage(), false]);

  app.innerHTML = `<div class="d-wrap">
    <div class="d-dev"><b>${esc(STATUS.name || "smolbase")}</b>
      <span class="mono">${esc(STATUS.ip || "")}</span>
      <span class="mono">${heapKb}</span>
      <span class="mono">fw ${esc(STATUS.fwVersion || "?")}</span></div>
    <div class="d-tabs" role="tablist">${sections.map(([n], i) =>
      `<button role="tab" aria-selected="${i === 0}" class="${i === 0 ? "on" : ""}"
        data-t="${i}">${n}</button>`).join("")}</div>
    <div class="d-pages" id="dPages">${sections.map(([n, html, savable], i) =>
      `<section class="d-page${i === 0 ? " on" : ""}" data-sec="${n}"><h1>${n + (n === "System" || n === "App" ? " settings" : "")}</h1>${html}
        ${savable ? `<button class="primary savebtn" style="margin:0.5rem 0 1rem">Save ${n.toLowerCase()}</button>` : ""}
      </section>`).join("")}</div>
  </div>`;

  const pages = [...document.getElementById("dPages").children];
  const tabs = [...app.querySelectorAll("[data-t]")];
  const setTab = i => {
    tabs.forEach((t, j) => {
      t.classList.toggle("on", i === j);
      t.setAttribute("aria-selected", i === j);
    });
    pages.forEach((p, j) => p.classList.toggle("on", i === j));
  };
  tabs.forEach(t => t.addEventListener("click", () => setTab(+t.dataset.t)));

  // per-section save
  app.querySelectorAll(".savebtn").forEach(b => b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      const r = await postSettings(collect(b.closest(".d-page")));
      toast(r.changed ? "Saved" : "No changes");
    } catch (e) {
      toast("Save failed — " + e.message, true);
    }
    b.disabled = false;
  }));

  // firmware / filesystem update
  const upTarget = () => app.querySelector('[name="uptarget"]:checked').value;
  app.querySelectorAll('[name="uptarget"]').forEach(r => r.addEventListener("change", () => {
    document.getElementById("uphint").textContent = upTarget() === "fs"
      ? "Replaces ALL web assets and settings.json — settings revert to defaults; WiFi credentials survive."
      : "Streams into the inactive app slot; a failed upload leaves the running firmware untouched.";
  }));
  const fwgo = document.getElementById("fwgo");
  fwgo.addEventListener("click", async () => {
    const f = document.getElementById("fwfile").files[0];
    const msg = document.getElementById("fwmsg");
    if (!f) { msg.textContent = "Choose a .bin file first."; return; }
    fwgo.disabled = true;
    msg.textContent = "Uploading… don't power off the device.";
    try {
      const fd = new FormData();
      fd.append("file", f, f.name);
      const r = await fetch("/api/update" + (upTarget() === "fs" ? "?target=fs" : ""), { method: "POST", body: fd });
      if (r.ok) { msg.textContent = "Update accepted — the device is restarting."; toast("Update uploaded"); }
      else {
        let detail = "";
        try { detail = (await r.json()).error || ""; } catch (e) { /* non-JSON error body */ }
        msg.textContent = "Update failed (HTTP " + r.status + (detail ? "): " + detail : ").");
        toast("Update failed", true);
      }
    } catch (e) {
      msg.textContent = "Upload failed — " + e.message;
      toast("Upload failed", true);
    }
    fwgo.disabled = false;
  });

  // wifi: scan, inline join, forget-into-setup (ticket #30)
  let WNETS = [], wOpen = null, wTimer = null;
  const wlist = document.getElementById("wflist");
  const wmsg = document.getElementById("wfmsg");
  const renderNets = scanning => {
    const prev = wlist.querySelector("li.open input"); // keep a half-typed password across poll re-renders
    const keepVal = prev ? prev.value : "";
    wlist.innerHTML = (WNETS.length ? `<ul class="nets">${WNETS.map((n, i) =>
      `<li class="${n.ssid === wOpen ? "open" : ""}">
        <button type="button" class="row" aria-expanded="${n.ssid === wOpen}">
          <span>${esc(n.ssid)}${n.secure ? " &#128274;" : ""}</span>
          <span class="mono" style="color:var(--muted)">${n.rssi} dBm</span></button>
        <div class="join">${n.secure
          ? `<div class="pw"><input id="wpw${i}" type="password" autocomplete="off" placeholder="password">
             <button type="button" class="eye" data-eye="wpw${i}" aria-label="Show password">${EYE_OFF}</button></div>`
          : `<p class="hint" style="margin-top:0">Open network — no password needed.</p>`}
        <button class="primary" style="margin-top:0.5rem" data-join="${i}">Join ${esc(n.ssid)}</button>
        </div></li>`).join("")}</ul>` : "")
      + (scanning ? `<p class="hint">Scanning…</p>`
                  : (WNETS.length ? "" : `<p class="hint">No networks found — rescan.</p>`));
    const cur = wlist.querySelector("li.open input");
    if (cur && keepVal) cur.value = keepVal;
    wlist.querySelectorAll(".row").forEach((b, i) => b.addEventListener("click", () => {
      wOpen = wOpen === WNETS[i].ssid ? null : WNETS[i].ssid;
      renderNets(scanning);
      const inp = wlist.querySelector("li.open input");
      if (inp) inp.focus();
    }));
    wlist.querySelectorAll("[data-join]").forEach(b => b.addEventListener("click", async () => {
      const i = +b.dataset.join;
      const pw = document.getElementById("wpw" + i);
      b.disabled = true;
      wmsg.textContent = "Joining " + WNETS[i].ssid + "…";
      try {
        const r = await fetch("/api/wifi", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ssid: WNETS[i].ssid, pass: pw ? pw.value : "" }) });
        if (!r.ok) throw new Error("HTTP " + r.status);
        clearTimeout(wTimer);
        // The device is restarting: replace the whole WiFi page with the
        // handoff message so nothing stale (scan list, setup-mode box)
        // competes with it.
        b.closest(".d-page").innerHTML = `<h1>WiFi</h1>
          <p style="font-weight:600">Restarting to join ${esc(WNETS[i].ssid)}…</p>
          <p class="hint">This page will stop responding. If the password was wrong, the device
          comes back as its <span class="mono">${esc(STATUS.name || "smolbase-XXXX")}</span> setup
          access point after ~20 s instead — join it to try again.</p>`;
      } catch (e) {
        wmsg.textContent = "Join failed — " + e.message;
        b.disabled = false;
      }
    }));
  };
  const wpoll = async kick => {
    try {
      const j = await fetch("/api/wifi/scan" + (kick ? "?refresh=1" : "")).then(r => r.json());
      WNETS = j.networks || [];
      renderNets(j.status !== "done");
      if (j.status !== "done") wTimer = setTimeout(() => wpoll(false), 2500);
    } catch (e) {
      wmsg.textContent = "Scan failed — " + e.message;
    }
  };
  document.getElementById("wfscan").addEventListener("click", () => { clearTimeout(wTimer); wpoll(true); });

  // forget wifi: two-click arm, then POST and hand off to setup mode
  const wff = document.getElementById("wfforget");
  wff.addEventListener("click", async () => {
    if (!wff.dataset.armed) {
      wff.dataset.armed = "1";
      wff.textContent = "Really forget Wi-Fi? Click again";
      return;
    }
    wff.disabled = true;
    try {
      const r = await fetch("/api/wifi/forget", { method: "POST" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      clearTimeout(wTimer);
      wff.closest(".d-page").innerHTML = `<h1>WiFi</h1>
        <p style="font-weight:600">Credentials cleared — restarting into setup mode.</p>
        <p class="hint">Join the <span class="mono">${esc(STATUS.name || "smolbase-XXXX")}</span> Wi-Fi
        access point and the setup portal will open to pick a network. Settings are untouched.
        This page will stop responding.</p>`;
      toast("Wi-Fi forgotten — device restarting");
    } catch (e) {
      toast("Forget failed — " + e.message, true);
      wff.disabled = false;
      delete wff.dataset.armed;
      wff.innerHTML = "Forget Wi-Fi &amp; restart into setup";
    }
  });

  // factory reset with typed confirmation
  const dzc = document.getElementById("dzconfirm");
  const dzgo = document.getElementById("dzgo");
  dzc.addEventListener("input", () => { dzgo.disabled = dzc.value.trim().toLowerCase() !== "reset"; });
  dzgo.addEventListener("click", async () => {
    dzgo.disabled = true;
    try {
      const r = await fetch("/api/factory-reset", { method: "POST" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      // The device is gone: replace the whole page section with the handoff
      // message (same pattern as the WiFi join/forget flows, ticket #35) —
      // a toast over a still-interactive page undersold what just happened.
      dzgo.closest(".d-page").innerHTML = `<h1>Factory reset</h1>
        <p style="font-weight:600">Everything erased — the device is restarting into setup mode.</p>
        <p class="hint">Join its <span class="mono">smolbase-XXXX</span> Wi-Fi access point (a custom
        hostname is gone with the reset — the exact name is on the device's screen) and the setup
        portal will open to pick a network. Wi-Fi credentials, settings, and secrets are gone; the
        first boot takes a beat longer while radio calibration regenerates.
        This page will stop responding.</p>`;
    } catch (e) {
      toast("Reset failed — " + e.message, true);
      dzgo.disabled = false;
    }
  });
}

async function init() {
  try {
    const [st, se, zo] = await Promise.all([
      fetch("/api/status").then(r => r.json()),
      fetch("/api/settings").then(r => r.json()),
      fetch("/zones.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
    ]);
    STATUS = st || {};
    SCHEMA = (se && se.settings) || [];
    ZONES = zo || {};
    render();
  } catch (e) {
    app.innerHTML = `<p class="hint" style="padding:1.5rem 1rem">Failed to load settings — ${esc(e.message)}.
      Is the device reachable? <button onclick="location.reload()">Retry</button></p>`;
  }
}
init();
</script>
</body>
</html>
