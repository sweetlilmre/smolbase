<!doctype html>
<!-- Landing page AND the StockApp demo config: any app-section color setting
     renders as a live color picker, any app-section bool or inline choice as a
     Behaviour row — change one and the panel repaints via SettingsChanged
     (picking a screen effect here is the web twin of a long press on the
     device's touch pad, and lands on the panel the same way). This is
     the "html" corner of the app/config/html extension-surface triangle (see
     docs/building-your-app.md), and the custom-skin half of the two-skins
     exhibit (stance A', ticket #34): the settings page's App tab renders the
     same values as the free skin. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smolbase</title>
<link rel="stylesheet" href="/smolbase.css">
<style>
  body { display: grid; place-items: center; font-size: 16px; }
  main { text-align: center; padding: 2rem 1rem; }
  .mono { color: var(--muted); }
  a.btn { display: inline-block; margin-top: 1.25rem; padding: 0.6rem 1.4rem;
    background: var(--accent); color: var(--accent-ink); border-radius: 6px;
    text-decoration: none; font-weight: 600; }
  .cfg { margin-top: 2rem; border: 1px solid var(--line); border-radius: 8px;
    padding: 1rem 1.25rem; text-align: left; }
  .cfg h2 { font-size: 0.95rem; margin: 0 0 0.6rem; color: var(--muted); font-weight: 600; }
  .cfg label { display: flex; align-items: center; justify-content: space-between;
    gap: 1.5rem; padding: 0.3rem 0; font-size: 0.9rem; color: var(--ink); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>smolbase is alive</h1>
  <p class="mono" id="status">loading…</p>
  <a class="btn" href="/settings.html">Open settings</a>
  <div class="cfg" id="cfg" hidden>
    <div id="colors" hidden><h2>Screen colors</h2><div id="pickers"></div></div>
    <div id="behaviour" hidden><h2>Behaviour</h2><div id="toggles"></div></div>
    <p class="msg" id="cfgmsg">Changes apply on the panel immediately.</p>
  </div>
</main>
<script src="/smolbase.js"></script>
<script>
fetch("/api/status").then(r => r.json()).then(s => {
  document.getElementById("status").textContent =
    `${s.name}.local · ${s.ip} · ${Math.round(s.heapFree / 1024)} kB heap free`;
}).catch(() => document.getElementById("status").textContent = "api unreachable");

// Render a picker for every app-section color setting, and a Behaviour row for
// every app-section bool and choice — driven by the schema's type (ticket #58),
// not by sniffing values. Generic on purpose: register another color, bool or
// choice in StockApp::setup() and it appears here with zero HTML changes.
fetch("/api/settings").then(r => r.json()).then(j => {
  const msg = document.getElementById("cfgmsg");
  const saveOne = (s, patch) => postSettings(patch)
    .then(() => {
      setMsg(msg, "Changes apply on the panel immediately.");
      toast(s.label + " saved");
    }).catch(e => setMsg(msg, "Save failed — " + e.message, true));
  const addRow = (boxId, s, inp, readPatch) => {
    const row = document.createElement("label");
    row.textContent = s.label;
    inp.addEventListener("change", () => saveOne(s, readPatch()));
    row.appendChild(inp);
    document.getElementById(boxId).appendChild(row);
  };

  const app = (j.settings || []).filter(s => s.section === "app");
  const colors = app.filter(s => s.type === "color");
  const bools = app.filter(s => s.type === "bool");
  // Inline catalogs only: a URL-sourced catalog is the browser's job to fetch
  // and belongs on the settings page, not on this one-shot landing skin.
  const picks = app.filter(s => s.type === "choice" && s.options);
  colors.forEach(s => {
    const inp = document.createElement("input");
    inp.type = "color";
    inp.value = s.value;
    addRow("pickers", s, inp, () => ({ [s.key]: inp.value }));
  });
  bools.forEach(s => {
    const inp = document.createElement("input");
    inp.type = "checkbox";
    inp.checked = !!s.value;
    addRow("toggles", s, inp, () => ({ [s.key]: inp.checked }));
  });
  // A choice is a label the user picks and a value the firmware consumes; both
  // halves POST together as {key: value, key_name: label} (ADR 0002).
  picks.forEach(s => {
    const sel = document.createElement("select");
    const opts = s.options || {};
    Object.keys(opts).forEach(label => {
      const o = document.createElement("option");
      o.value = opts[label];
      o.textContent = label;
      o.dataset.label = label;
      if (label === s.valueLabel) o.selected = true;
      sel.appendChild(o);
    });
    addRow("toggles", s, sel, () => ({
      [s.key]: sel.value,
      [s.key + "_name"]: sel.selectedOptions[0].dataset.label,
    }));
  });
  const behaviour = bools.length + picks.length;
  document.getElementById("colors").hidden = !colors.length;
  document.getElementById("behaviour").hidden = !behaviour;
  document.getElementById("cfg").hidden = !colors.length && !behaviour;
}).catch(() => {});
</script>
</body>
</html>
